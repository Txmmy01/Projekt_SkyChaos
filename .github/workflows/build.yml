name: SkyChaos CI

on:
  push:
    branches: [main, feature/java25-professional]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 25 / Paper 26.3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Java
        run: java -version
      - name: Validate and build
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: SkyChaos-build
          path: target/SkyChaos.jar
          if-no-files-found: error
