name: SkyChaos
version: 2.1.0
main: de.skychaos.SkyChaos
api-version: '26.3'
authors: [Txmmy01]
description: Ready-to-play Skyblock chaos challenge with void dimensions, loot islands and timed events
commands:
  challenge:
    description: Verwaltet die SkyChaos-Challenge
    usage: /challenge <start|reset|difficulty|loot|pause|resume|event|stats|stop|reload>
    aliases: [sc]
permissions:
  skychaos.admin:
    description: Darf die Insel erstellen und die Challenge administrieren
    default: op
  skychaos.play:
    description: Darf die Challenge steuern
    default: op
