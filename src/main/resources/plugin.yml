name: SkyChaos
version: 2.0.0
main: de.skychaos.SkyChaos
api-version: '26.3'
authors: [Txmmy01]
description: Configurable SkyBlock challenge with timed random events
commands:
  challenge:
    description: Verwaltet die SkyChaos-Challenge
    usage: /challenge <build|pos1|pos2|save|start|reset|pause|resume|event|stats|stop|reload>
    aliases: [sc]
permissions:
  skychaos.admin:
    description: Darf die Insel erstellen und die Challenge administrieren
    default: op
  skychaos.play:
    description: Darf die Challenge steuern
    default: op
